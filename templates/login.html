{% extends "base.html" %}
{% block titulo %}Ingresar{% endblock %}
{% block contenido %}
<section class="tarjeta login">
  <h1>ClinAgenda</h1>
  <p class="ayuda">Escriba su usuario y contraseña para entrar.</p>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf_token }}">
    <label for="usuario">Usuario</label>
    <input id="usuario" name="usuario" value="{{ usuario_escrito or '' }}" autocomplete="username" required autofocus>
    <label for="clave">Contraseña</label>
    <input id="clave" name="clave" type="password" autocomplete="current-password" required>
    <button class="boton boton-grande" type="submit">Entrar</button>
  </form>
</section>
{% endblock %}
