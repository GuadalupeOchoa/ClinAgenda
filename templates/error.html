{% extends "base.html" %}
{% from "_macros.html" import icono %}
{% block titulo %}{{ titulo }}{% endblock %}
{% block contenido %}
<section class="tarjeta pagina-error">
  <span class="confirmar-icono">{{ icono('alerta') }}</span>
  <h1>{{ titulo }}</h1>
  <p>{{ mensaje }}</p>
  <div class="acciones" style="justify-content:center">
    <a class="boton boton-secundario boton-grande" href="javascript:history.back()">{{ icono('izquierda') }} Volver</a>
    <a class="boton boton-grande" href="{{ url_for('agenda') }}">Ir al inicio</a>
  </div>
</section>
{% endblock %}
