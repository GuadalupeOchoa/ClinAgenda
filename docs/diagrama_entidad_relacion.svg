<g transform="translate(40, 880)">
  <text x="0" y="0" font-size="20" font-weight="700" fill="#0b2e3d">ClinAgenda · Diagrama entidad-relación</text>
  <text x="0" y="24" font-size="12.5" fill="#556675">PK clave primaria · FK clave foránea · UQ único · IX índice. Regla clave: índice único (medico_id, fecha, hora) en citas AGENDADA → un médico nunca tiene dos citas a la misma hora.</text>
  <text x="0" y="44" font-size="12.5" fill="#556675">Línea punteada: pacientes.creado_por → usuarios. citas.creado_por y citas.actualizado_por → usuarios. La tabla auditoria nunca se borra.</text>
  <text x="0" y="64" font-size="12.5" fill="#556675">Valores: tipo_documento CEDULA/PASAPORTE/NINGUNO · estado AGENDADA/CANCELADA/ATENDIDA/NO_ASISTIO · rol ADMIN/RECEPCION/MEDICO.</text>
</g>
